<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="منظومة تسجيل طلبة برنامج حُفّاظ السُّنة وإجراء امتحاناتهم واعتماد نتائجهم وإصدار شهاداتهم." />
    <meta name="theme-color" content="#16324F" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>برنامج حُفّاظ السُّنة — منظومة الامتحانات والشهادات</title>
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
